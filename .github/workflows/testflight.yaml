name: Deploy to TestFlight

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: testflight-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and Upload
    runs-on: macos-26
    timeout-minutes: 60

    env:
      APP_BUNDLE_ID: com.academy.hendraaaa.Rosetta

      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_CONTENT_BASE64: ${{ secrets.ASC_KEY_CONTENT_BASE64 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_APP_ID: ${{ secrets.APP_STORE_APP_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install signing certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APP_BUNDLE_ID: com.academy.hendraaaa.Rosetta
        run: |
          set -euo pipefail

          CERTIFICATE_PATH="$RUNNER_TEMP/distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/Rosetta.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          printf '%s' "$BUILD_CERTIFICATE_BASE64" \
            | base64 -D > "$CERTIFICATE_PATH"

          printf '%s' "$BUILD_PROVISION_PROFILE_BASE64" \
            | base64 -D > "$PROFILE_PATH"

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" \
            -A

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains \
            -d user \
            -s "$KEYCHAIN_PATH"

          security cms \
            -D \
            -i "$PROFILE_PATH" \
            > "$PROFILE_PLIST"

          PROFILE_UUID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :UUID" \
              "$PROFILE_PLIST"
          )

          PROFILE_NAME=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Name" \
              "$PROFILE_PLIST"
          )

          PROFILE_APP_IDENTIFIER=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Entitlements:application-identifier" \
              "$PROFILE_PLIST"
          )

          PROFILE_BUNDLE_ID="${PROFILE_APP_IDENTIFIER#*.}"

          echo "Profile name: $PROFILE_NAME"
          echo "Profile UUID: $PROFILE_UUID"
          echo "Profile Bundle ID: $PROFILE_BUNDLE_ID"

          if [ "$PROFILE_BUNDLE_ID" != "$APP_BUNDLE_ID" ]; then
            echo "ERROR: Provisioning profile Bundle ID mismatch"
            echo "Expected: $APP_BUNDLE_ID"
            echo "Found: $PROFILE_BUNDLE_ID"
            exit 1
          fi

          OLD_PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          NEW_PROFILE_DIR="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"

          mkdir -p "$OLD_PROFILE_DIR"
          mkdir -p "$NEW_PROFILE_DIR"

          cp "$PROFILE_PATH" \
            "$OLD_PROFILE_DIR/$PROFILE_UUID.mobileprovision"

          cp "$PROFILE_PATH" \
            "$NEW_PROFILE_DIR/$PROFILE_UUID.mobileprovision"

          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

          echo "Installed profiles:"
          find "$OLD_PROFILE_DIR" "$NEW_PROFILE_DIR" \
            -name "*.mobileprovision" \
            -print

          echo "Available signing identities:"
          security find-identity -v -p codesigning
          
      - name: Verify signing identities
        run: |
          security find-identity -v -p codesigning

      - name: Install Ruby dependencies
        run: |
          bundle config path vendor/bundle
          bundle install --jobs 4 --retry 3

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project GameClassification.xcodeproj \
            -scheme GameClassification

      - name: Verify Release signing settings
        run: |
          set -euo pipefail

          echo "PROFILE_NAME=$PROFILE_NAME"
          echo "PROFILE_UUID=$PROFILE_UUID"

          xcodebuild \
            -project GameClassification.xcodeproj \
            -scheme GameClassification \
            -configuration Release \
            -showBuildSettings \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="com.academy.hendraaaa.Rosetta" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
          | grep -E \
            "PRODUCT_BUNDLE_IDENTIFIER|DEVELOPMENT_TEAM|CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE"

      - name: Build and upload to TestFlight
        run: |
          bundle exec fastlane ios beta

      - name: Upload IPA as workflow artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GameClassification-${{ github.run_number }}
          path: build/GameClassification.ipa
          retention-days: 7

      - name: Clean temporary keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/distribution.p12"
          rm -f "$RUNNER_TEMP/build_pp.mobileprovision"
