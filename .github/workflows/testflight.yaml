name: Deploy to TestFlight

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: testflight-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and Upload
    runs-on: macos-26
    timeout-minutes: 60

    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_CONTENT_BASE64: ${{ secrets.ASC_KEY_CONTENT_BASE64 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_APP_ID: ${{ secrets.APP_STORE_APP_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install signing certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          CERTIFICATE_PATH="$RUNNER_TEMP/distribution.p12"
          PP_PATH="$RUNNER_TEMP/build.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          if [ -z "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "BUILD_CERTIFICATE_BASE64 is empty"
            exit 1
          fi

          if [ -z "$BUILD_PROVISION_PROFILE_BASE64" ]; then
            echo "BUILD_PROVISION_PROFILE_BASE64 is empty"
            exit 1
          fi

          if [ -z "$P12_PASSWORD" ]; then
            echo "P12_PASSWORD is empty"
            exit 1
          fi

          printf '%s' "$BUILD_CERTIFICATE_BASE64" \
            | /usr/bin/base64 -D \
            > "$CERTIFICATE_PATH"

          printf '%s' "$BUILD_PROVISION_PROFILE_BASE64" \
            | /usr/bin/base64 -D \
            > "$PP_PATH"

          echo "Decoded certificate size:"
          stat -f "%z bytes" "$CERTIFICATE_PATH"

          echo "Decoded provisioning profile size:"
          stat -f "%z bytes" "$PP_PATH"

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" \
            -A

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains \
            -d user \
            -s "$KEYCHAIN_PATH"

          echo "Available signing identities:"
          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH"

          security cms \
            -D \
            -i "$PP_PATH" \
            > "$PROFILE_PLIST"

          PROFILE_UUID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :UUID" \
              "$PROFILE_PLIST"
          )

          PROFILE_NAME=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Name" \
              "$PROFILE_PLIST"
          )

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          cp "$PP_PATH" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "Installed provisioning profile:"
          echo "Name: $PROFILE_NAME"
          echo "UUID: $PROFILE_UUID"

      - name: Verify signing identities
        run: |
          security find-identity -v -p codesigning

      - name: Install Ruby dependencies
        run: |
          bundle config path vendor/bundle
          bundle install --jobs 4 --retry 3

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project GameClassification.xcodeproj \
            -scheme GameClassification

      - name: Build and upload to TestFlight
        run: |
          bundle exec fastlane ios beta

      - name: Upload IPA as workflow artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GameClassification-${{ github.run_number }}
          path: build/GameClassification.ipa
          retention-days: 7

      - name: Clean temporary keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/distribution.p12"
          rm -f "$RUNNER_TEMP/build_pp.mobileprovision"
